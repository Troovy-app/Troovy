<style>
:root{
  --cream:#FFFFFF;
  --paper:#FFFFFF;
  --olive:#5C622E;
  --olive-deep:#3F4420;
  --olive-soft:#A5A26B;
  --sand:#EFE7CC;
  --line:#E4D9B6;
  --ink:#2B2E1B;
  --muted:#6B6D4A;
  --sold:#8C8870;
  --danger:#9C3B2A;
  --radius:18px;
  --font:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:only light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.55;font-weight:500;min-height:100vh;display:flex;flex-direction:column}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--olive);outline-offset:3px;border-radius:8px}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* En-tête */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;min-height:72px}
.brand img{height:52px;width:auto}
.top nav a{font-weight:700;text-decoration:none;padding:10px 4px;color:var(--olive-deep)}
.top nav a:hover{text-decoration:underline;text-underline-offset:4px}

/* Titres */
h1,h2,h3{font-weight:800;letter-spacing:-.01em;line-height:1.15;margin:0}
.hero{padding:30px 0 10px}
.hero h1{font-size:clamp(1.95rem,6.2vw,3.3rem);max-width:15ch;color:var(--olive-deep)}
.hero p{margin:14px 0 0;max-width:46ch;color:var(--muted);font-size:1.06rem}

/* Page d'accueil et rayons */
.is-landing .top .brand{visibility:hidden}
.is-landing .foot img{display:none}
.landing{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 0 40px;min-height:calc(100vh - 260px);justify-content:center}
.landing .logo{width:min(78vw,380px);height:auto}
.landing .lead{margin:6px 0 0;max-width:34ch;color:var(--muted);font-size:1.08rem}
.rayons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:520px;margin:30px 0 22px}
.rayon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:84px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--paper);text-decoration:none;color:var(--olive-deep);font-weight:800;font-size:1.18rem;padding:12px;transition:background .2s,border-color .2s}
.rayon:hover{background:var(--sand);border-color:var(--olive-soft)}
.rayon small{font-weight:600;font-size:.84rem;color:var(--muted)}
.shophead{padding:18px 0 4px}
.shophead h1{font-size:clamp(1.7rem,5.4vw,2.6rem);color:var(--olive-deep)}
.moreb{display:flex;justify-content:center;margin:-20px 0 48px}

/* Filtres */
.filters{display:grid;gap:12px;margin:22px 0 8px}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted)}
.search input{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:13px 18px 13px 46px;font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;color:var(--olive-deep)}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--cream)}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.select{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 12px;font-weight:600;max-width:100%}
.check{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--olive)}
.row .select{flex:1 1 140px;min-width:0}
@media(min-width:620px){.row .select{flex:0 1 auto}}
.count{margin-left:auto;color:var(--muted);font-weight:600;font-size:.92rem}

/* Grille d'articles */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px;margin:14px 0 48px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 22px}}
@media(min-width:980px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:block;text-decoration:none}
.ph{position:relative;aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;background:var(--sand)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .ph img{transform:scale(1.035)}
.noimg{position:absolute;inset:0;display:grid;place-items:center}
.noimg svg{width:44%;stroke:var(--olive-soft)}
.badge{position:absolute;top:10px;left:10px;background:var(--cream);color:var(--olive-deep);font-weight:800;font-size:.8rem;padding:4px 11px;border-radius:999px}
.is-sold .ph img,.stage.is-sold img{filter:grayscale(1);opacity:.55}
main:focus{outline:none}
[hidden]{display:none!important}
/* Étiquette de prix : le détail qui rappelle l'étiquette d'un vêtement */
.tagwrap{position:absolute;right:16px;bottom:14px;transform:rotate(-3deg);transform-origin:right center;transition:transform .3s ease}
.tagwrap::after{content:"";position:absolute;left:calc(100% - 15px);top:50%;width:46px;height:2px;background:var(--cream);transform-origin:left center;transform:rotate(-24deg)}
.card:hover .tagwrap{transform:rotate(2deg)}
.tag{display:block;position:relative;background:var(--olive);color:var(--cream);font-weight:800;font-size:.98rem;line-height:1;padding:9px 26px 9px 12px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.tag::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--cream)}
.is-sold .tag{background:var(--sold)}
.meta{padding:11px 2px 0}
.meta h3{font-size:1rem;font-weight:700;letter-spacing:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:4px;color:var(--muted);font-size:.92rem;min-height:1.6em}
.size{border:1.5px solid var(--line);border-radius:8px;padding:0 8px;font-weight:700;color:var(--olive-deep);font-size:.84rem;line-height:1.5}

/* Chargement et états vides */
.sk .ph{background:linear-gradient(100deg,var(--sand) 30%,#F6EFD8 50%,var(--sand) 70%);background-size:200% 100%;animation:sh 1.4s linear infinite}
.sk .line{height:14px;border-radius:7px;background:var(--sand);margin-top:12px;width:70%}
@keyframes sh{to{background-position:-200% 0}}
.state{text-align:center;padding:48px 16px 64px;color:var(--muted);max-width:44ch;margin:0 auto}
.state svg{width:84px;stroke:var(--olive-soft);margin:0 auto 12px}
.state h2{font-size:1.3rem;color:var(--olive-deep);margin-bottom:6px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--olive);background:var(--olive);color:var(--cream);font-weight:800;border-radius:999px;padding:13px 26px;cursor:pointer;text-decoration:none;font-size:1rem;transition:background .2s}
.btn:hover{background:var(--olive-deep);border-color:var(--olive-deep)}
.btn.ghost{background:transparent;color:var(--olive-deep)}
.btn.ghost:hover{background:var(--sand)}
.btn.small{padding:8px 16px;font-size:.92rem}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.danger:hover{background:#F6E4DF}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed;pointer-events:none}

/* Fiche article */
.back{display:inline-flex;align-items:center;gap:6px;margin:18px 0 14px;font-weight:700;text-decoration:none;color:var(--olive-deep)}
.back:hover{text-decoration:underline;text-underline-offset:4px}
.product{display:grid;gap:22px;margin-bottom:56px}
@media(min-width:820px){.product{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:start}}
.stage{position:relative;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--sand);touch-action:pan-y}
.stage img{width:100%;height:100%;object-fit:cover}
.stage .tagwrap{right:22px;bottom:20px}
.stage .tag{font-size:1.15rem;padding:11px 30px 11px 14px}
.thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:none;width:68px;height:84px;border-radius:12px;overflow:hidden;border:2.5px solid transparent;padding:0;cursor:pointer;background:var(--sand)}
.thumbs button[aria-current="true"]{border-color:var(--olive)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info h1{font-size:clamp(1.6rem,4.6vw,2.3rem);color:var(--olive-deep)}
.price{font-size:1.7rem;font-weight:800;margin:10px 0 18px;color:var(--olive)}
.is-sold-info .price{color:var(--sold)}
.facts{margin:0 0 20px;border-top:1.5px solid var(--line)}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1.5px solid var(--line)}
.facts dt{color:var(--muted);font-weight:600}
.facts dd{margin:0;font-weight:700;text-align:right}
.desc{margin:0 0 24px;white-space:pre-line;max-width:60ch}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.cta .btn.main{flex:1 1 220px}
.note{margin:12px 0 0;color:var(--muted);font-size:.93rem}

/* Pied de page */
.foot{margin-top:auto;border-top:1.5px solid var(--line);padding:30px 0 40px;color:var(--muted)}
.foot .wrap{display:flex;flex-wrap:wrap;gap:18px 40px;align-items:center;justify-content:space-between}
.foot img{height:70px;width:auto}
.foot p{margin:0;font-size:.93rem}
.foot a{font-weight:700}

/* Espace admin */
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:22px;margin:22px 0 56px}
.narrow{max-width:460px;margin-left:auto;margin-right:auto}
.panel h1{font-size:1.6rem;color:var(--olive-deep);margin-bottom:6px}
.panel .lead{color:var(--muted);margin:0 0 18px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:700}
.field .hint{color:var(--muted);font-size:.88rem}
.input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:1rem}
textarea.input{min-height:110px;resize:vertical}
.two{display:grid;gap:14px}
@media(min-width:620px){.two{grid-template-columns:1fr 1fr}}
.err{color:var(--danger);font-weight:700;margin:10px 0 0}
.tabs{display:flex;gap:8px;margin:22px 0 0;flex-wrap:wrap;align-items:center}
.tabs .sp{margin-left:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:8px}
.pitem{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--sand)}
.pitem img{width:100%;height:100%;object-fit:cover}
.pitem .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(43,46,27,.82);color:#fff;cursor:pointer;font-weight:800;line-height:1}
.pitem .cover{position:absolute;left:4px;bottom:4px;right:4px;border:0;border-radius:8px;background:rgba(255,255,255,.94);color:var(--olive-deep);font-weight:800;font-size:.72rem;padding:4px;cursor:pointer}
.pitem .is{background:var(--olive);color:var(--cream)}
.dropzone{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--olive-soft);border-radius:14px;padding:18px;cursor:pointer;font-weight:700;color:var(--olive-deep);background:var(--cream)}
.dropzone input{display:none}
.list{display:grid;gap:12px;margin-top:6px}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:10px;background:#fff}
.item .th{width:64px;height:80px;border-radius:10px;overflow:hidden;background:var(--sand)}
.item .th img{width:100%;height:100%;object-fit:cover}
.item h3{font-size:1rem;font-weight:700;letter-spacing:0}
.item .m{color:var(--muted);font-size:.9rem}
.item .act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code{display:block;background:var(--sand);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;word-break:break-all;margin:10px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,24px);background:var(--olive-deep);color:var(--cream);font-weight:700;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Session et appels Supabase (sans bibliothèque externe) ---------- */
let session = null;
try{ session = JSON.parse(localStorage.getItem("troovy_session")||"null"); }catch(e){}
function setSession(s){ session = s; try{ s ? localStorage.setItem("troovy_session",JSON.stringify(s)) : localStorage.removeItem("troovy_session"); }catch(e){} }
function readErr(j,fallback){ return (j && (j.message||j.msg||j.error_description||j.error)) || fallback; }

async function refreshSession(){
  if(!session || !session.refresh_token) return false;
  try{
    const r = await fetch(CONFIG.SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:CONFIG.SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!r.ok) return false;
    const j = await r.json();
    setSession({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user||session.user});
    return true;
  }catch(e){ return false; }
}

async function sb(path, o={}){
  const method = o.method||"GET";
  const headers = Object.assign({apikey:CONFIG.SUPABASE_KEY}, o.headers||{});
  const useAuth = o.auth !== false;
  if(useAuth && session && session.access_token) headers.Authorization = "Bearer "+session.access_token;
  let body = o.body;
  if(body !== undefined && !(body instanceof Blob) && typeof body !== "string"){ headers["Content-Type"]="application/json"; body = JSON.stringify(body); }
  const res = await fetch(CONFIG.SUPABASE_URL+path,{method,headers,body});
  if(res.status===401 && useAuth && session && !o._retried){
    const ok = await refreshSession();
    if(!ok) setSession(null);
    return sb(path,Object.assign({},o,{_retried:true}));
  }
  if(!res.ok){
    let j=null; try{ j = await res.json(); }catch(e){}
    throw new Error(readErr(j,"Erreur "+res.status));
  }
  if(res.status===204) return null;
  const ct = res.headers.get("content-type")||"";
  return ct.includes("json") ? res.json() : res.text();
}

async function login(email,password){
  const r = await fetch(CONFIG.SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:CONFIG.SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){
    const m = readErr(j,"");
    throw new Error(/invalid login/i.test(m) ? "E-mail ou mot de passe incorrect." : (m||"Connexion impossible."));
  }
  setSession({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user});
}

/* ---------- Données ---------- */
const state = {products:null, at:0, section:"tout", limit:PAGE, lastShop:"", filters:{q:"",cat:"",size:"",sort:"new",sold:false}};
const LIST_COLS = "id,title,brand,category,section,size,condition,price_cents,photos,status,created_at";
async function loadProducts(){
  const q = cols => `/rest/v1/products?select=${cols}&status=in.(available,reserved,sold)&order=created_at.desc&limit=1000`;
  try{ return await sb(q(LIST_COLS),{auth:false}); }
  catch(e){ if(/section/i.test(e.message)) return sb(q(LIST_COLS.replace(",section","")),{auth:false}); throw e; }
}
async function ensureProducts(){
  if(!state.products || Date.now()-state.at>60000){ state.products = await loadProducts(); state.at = Date.now(); }
}

/* ---------- Routage ---------- */
let navId = 0;
async function route(){
  const parts = location.hash.replace(/^#\/?/,"").split("/");
  const page = parts[0]||"home";
  const id = ++navId;
  window.scrollTo(0,0);
  document.body.classList.toggle("is-landing", page==="home");
  try{
    if(page==="article") await renderProduct(parts[1],id);
    else if(page==="admin") await renderAdmin(id);
    else if(page==="rayon") await renderShop(parts[1]||"tout",id);
    else await renderLanding(id);
  }catch(e){ if(id===navId) renderError(e.message); }
  if(id===navId) app.focus({preventScroll:true});
}
window.addEventListener("hashchange",route);

function renderError(msg){
  app.innerHTML = `<div class="state">${HANGER}<h2>Le chargement a échoué</h2><p>Vérifiez la connexion, puis réessayez.</p><p style="font-size:.85rem">${esc(msg)}</p><button class="btn" onclick="state.products=null;route()">Réessayer</button></div>`;
}

/* ---------- Accueil (logo + rayons) ---------- */
async function renderLanding(id){
  document.title = "Troovy – Vêtements de seconde main";
  app.innerHTML = `
    <section class="landing">
      <h1 class="sr">Troovy, vêtements de seconde main</h1>
      <img class="logo" src="${FULLSRC}" alt="Troovy, le plaisir de donner une nouvelle chance" width="380" height="209">
      <p class="lead">Des vêtements de seconde main, choisis un par un. Chaque pièce est unique.</p>
      <nav class="rayons" aria-label="Rayons">${SECTIONS.map(x=>`<a class="rayon" href="#/rayon/${x.k}">${x.l}<small data-n="${x.k}">&nbsp;</small></a>`).join("")}</nav>
      <a class="btn ghost" href="#/rayon/tout">Voir tous les articles</a>
    </section>`;
  try{ await ensureProducts(); }catch(e){ return; }
  if(id!==navId) return;
  const live = state.products.filter(p=>p.status!=="sold");
  SECTIONS.forEach(x=>{
    const n = live.filter(p=>p.section===x.k).length;
    const el = app.querySelector(`[data-n="${x.k}"]`);
    if(el) el.textContent = n ? `${n} article${n>1?"s":""}` : "Bientôt";
  });
}

/* ---------- Rayon (liste d'articles) ---------- */
function rayonNav(cur){
  return `<div class="chips" role="group" aria-label="Rayons">${[{k:"tout",l:"Tout"},...SECTIONS].map(x=>`<a class="chip" href="#/rayon/${x.k}" aria-pressed="${cur===x.k}" style="text-decoration:none">${x.l}</a>`).join("")}</div>`;
}
async function renderShop(section,id){
  if(section!=="tout" && !SECTIONS.some(x=>x.k===section)) section="tout";
  if(state.section!==section){ state.section=section; state.filters.cat=""; state.filters.size=""; }
  state.limit = PAGE; state.lastShop = "#/rayon/"+section;
  const name = section==="tout" ? "Tous les articles" : secLabel(section);
  document.title = `${name} – Troovy`;
  app.innerHTML = `
    <section class="shophead"><h1>${name}</h1></section>
    ${rayonNav(section)}
    <section aria-label="Catalogue">
      <div class="filters" id="filters" hidden></div>
      <div class="grid" id="grid" aria-busy="true">${Array.from({length:8},()=>`<div class="sk"><div class="ph"></div><div class="line"></div></div>`).join("")}</div>
      <div class="moreb" id="more"></div>
    </section>`;
  await ensureProducts();
  if(id!==navId) return;
  drawFilters(); drawGrid();
}

function inSection(){ return state.section==="tout" ? state.products : state.products.filter(p=>p.section===state.section); }

function drawFilters(){
  const f = state.filters, list = inSection();
  const cats = [...new Set(list.map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr"));
  const sizes = [...new Set(list.map(p=>p.size).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"fr",{numeric:true}));
  const box = document.getElementById("filters");
  if(!list.length){ box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg>
      <label class="sr" for="q">Rechercher un article</label>
      <input id="q" class="" type="search" placeholder="Rechercher une robe, une marque, une taille" value="${esc(f.q)}" autocomplete="off"></div>
    <div class="chips" id="chips" role="group" aria-label="Catégories"></div>
    <div class="row">
      <label class="sr" for="size">Taille</label>
      <select id="size" class="select"><option value="">Toutes les tailles</option>${sizes.map(s=>`<option ${f.size===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
      <label class="sr" for="sort">Trier</label>
      <select id="sort" class="select">
        <option value="new" ${f.sort==="new"?"selected":""}>Nouveautés</option>
        <option value="asc" ${f.sort==="asc"?"selected":""}>Prix croissant</option>
        <option value="desc" ${f.sort==="desc"?"selected":""}>Prix décroissant</option>
      </select>
      <label class="check"><input type="checkbox" id="sold" ${f.sold?"checked":""}> Afficher les articles vendus</label>
      <span class="count" id="count" aria-live="polite"></span>
    </div>`;
  const drawChips = () => {
    document.getElementById("chips").innerHTML = ["",...cats].map(c=>`<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="${f.cat===c}">${c?esc(c):"Tout"}</button>`).join("");
  };
  drawChips();
  document.getElementById("chips").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; f.cat=b.dataset.c; drawChips(); redraw(); });
  document.getElementById("q").addEventListener("input",e=>{ f.q=e.target.value; redraw(); });
  document.getElementById("size").addEventListener("change",e=>{ f.size=e.target.value; redraw(); });
  document.getElementById("sort").addEventListener("change",e=>{ f.sort=e.target.value; redraw(); });
  document.getElementById("sold").addEventListener("change",e=>{ f.sold=e.target.checked; redraw(); });
}

const redraw = () => { state.limit = PAGE; drawGrid(); };
function filteredProducts(){
  const f = state.filters;
  let list = inSection().filter(p => f.sold || p.status!=="sold");
  if(f.cat) list = list.filter(p=>p.category===f.cat);
  if(f.size) list = list.filter(p=>p.size===f.size);
  if(f.q){ const q = norm(f.q).split(/\s+/).filter(Boolean); list = list.filter(p=>{ const h = norm([p.title,p.brand,p.category,p.size,p.condition].join(" ")); return q.every(w=>h.includes(w)); }); }
  const by = f.sort==="asc" ? (a,b)=>a.price_cents-b.price_cents : f.sort==="desc" ? (a,b)=>b.price_cents-a.price_cents : (a,b)=>String(b.created_at).localeCompare(String(a.created_at));
  return list.sort((a,b)=>(RANK[a.status]-RANK[b.status]) || by(a,b));
}

function card(p){
  const img = p.photos && p.photos[0];
  const sold = p.status==="sold";
  return `<a class="card ${sold?"is-sold":""}" href="#/article/${esc(p.id)}">
    <div class="ph">${img?`<img src="${esc(img)}" alt="${esc(p.title)}" loading="lazy" width="400" height="500">`:`<div class="noimg">${HANGER}</div>`}
      ${p.status==="reserved"?`<span class="badge">Réservé</span>`:""}
      <span class="tagwrap"><span class="tag">${sold?"Vendu":fmtPrice(p.price_cents)}</span></span>
    </div>
    <div class="meta"><h3>${esc(p.title)}</h3><div class="sub"><span>${esc(p.brand||"")}</span>${p.size?`<span class="size">${esc(p.size)}</span>`:""}</div></div>
  </a>`;
}

function drawGrid(){
  const grid = document.getElementById("grid"); if(!grid) return;
  const list = filteredProducts();
  grid.removeAttribute("aria-busy");
  const count = document.getElementById("count");
  if(count) count.textContent = list.length ? `${list.length} article${list.length>1?"s":""}` : "";
  const more = document.getElementById("more"); if(more) more.innerHTML = "";
  if(!state.products.length || !inSection().length){
    grid.className=""; grid.innerHTML = `<div class="state">${HANGER}<h2>Le dressing se remplit</h2><p>Aucune pièce n'est en ligne dans ce rayon pour le moment. De nouveaux articles arrivent bientôt.</p><a class="btn ghost" href="#/">Voir les autres rayons</a></div>`; return;
  }
  if(!list.length){
    grid.className=""; grid.innerHTML = `<div class="state">${HANGER}<h2>Rien ne correspond</h2><p>Aucun article ne correspond à cette recherche.</p><button class="btn ghost" id="reset">Effacer les filtres</button></div>`;
    document.getElementById("reset").onclick=()=>{ Object.assign(state.filters,{q:"",cat:"",size:"",sort:"new",sold:false}); drawFilters(); redraw(); };
    return;
  }
  grid.className = "grid"; grid.innerHTML = list.slice(0,state.limit).map(card).join("");
  if(more && list.length>state.limit){
    more.innerHTML = `<button class="btn ghost" id="moreb" type="button">Voir plus d'articles</button>`;
    document.getElementById("moreb").onclick=()=>{ state.limit+=PAGE; drawGrid(); };
  }
}

function compress(file,max=1600,q=.82){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload=()=>{
      const r = Math.min(1,max/Math.max(img.width,img.height));
      const w = Math.round(img.width*r), h = Math.round(img.height*r);
      const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
      const ctx = cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      cv.toBlob(b=>{ URL.revokeObjectURL(url); b?resolve(b):reject(new Error("Photo illisible.")); },"image/jpeg",q);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("Une photo n'a pas pu être lue. Essayer un autre fichier (JPG ou PNG).")); };
    img.src=url;
  });
}

async function saveProduct(ev){
  ev.preventDefault();
  const err = document.getElementById("fe"), btn = document.getElementById("save");
  err.textContent="";
  const title = document.getElementById("title").value.trim();
  const price = parseFloat(document.getElementById("price").value.replace(/\s/g,"").replace(",","."));
  if(!title){ err.textContent="Ajouter un titre."; return; }
  if(!document.getElementById("sec").value){ err.textContent="Choisir un rayon (Femme, Homme, Enfant, Bébé, Chaussures ou Accessoires)."; return; }
  if(!isFinite(price) || price<0){ err.textContent="Entrer un prix valide, par exemple 18 ou 18,50."; return; }
  btn.disabled=true; const label = btn.textContent;
  try{
    const urls = [];
    let n = 0; const total = adm.photos.filter(p=>p.file).length;
    for(const p of adm.photos){
      if(!p.file){ urls.push(p.src); continue; }
      n++; btn.textContent = `Envoi des photos ${n}/${total}…`;
      const blob = await compress(p.file);
      const path = uid()+".jpg";
      await sb(`/storage/v1/object/${BUCKET}/${path}`,{method:"POST",body:blob,headers:{"Content-Type":"image/jpeg","x-upsert":"false","cache-control":"max-age=31536000"}});
      urls.push(publicUrl(path));
    }
    btn.textContent="Enregistrement…";
    const row = {title, description:document.getElementById("desc").value.trim()||null, brand:document.getElementById("brand").value.trim()||null,
      category:document.getElementById("cat").value, section:document.getElementById("sec").value, size:document.getElementById("size").value.trim()||null,
      condition:document.getElementById("cond").value, price_cents:Math.round(price*100), photos:urls, status:document.getElementById("st").value};
    if(adm.editing) await sb(`/rest/v1/products?id=eq.${adm.editing.id}`,{method:"PATCH",body:row,headers:{Prefer:"return=minimal"}});
    else await sb("/rest/v1/products",{method:"POST",body:row,headers:{Prefer:"return=minimal"}});
    const wasEdit = !!adm.editing;
    adm.last = wasEdit ? null : {section:row.section, category:row.category, condition:row.condition};
    resetForm(); state.products=null; adm.items=null;
    toast(wasEdit?"Article modifié":"Article en ligne");
    adm.view = wasEdit ? "list" : "add"; drawAdmin();
  }catch(ex){
    err.textContent = /row-level security|permission|not authorized/i.test(ex.message) ? "Action refusée : ce compte n'est pas administrateur." : ex.message;
    btn.disabled=false; btn.textContent=label;
  }
}

/* --- Liste des articles --- */
async function drawList(){
  const v = document.getElementById("view");
  v.innerHTML = `<div class="panel"><h1>Mes articles</h1><div class="list" id="ls"><p class="lead">Chargement…</p></div></div>`;
  try{
    if(!adm.items) adm.items = await sb("/rest/v1/products?select=*&order=created_at.desc");
  }catch(e){ document.getElementById("ls").innerHTML=`<p class="err">${esc(e.message)}</p>`; return; }
  const ls = document.getElementById("ls"); if(!ls) return;
  if(!adm.items.length){ ls.innerHTML = `<p class="lead">Aucun article pour le moment. Ajoutez le premier avec l'onglet « Ajouter un article ».</p>`; return; }
  ls.innerHTML = adm.items.map(p=>`<div class="item" data-id="${p.id}">
    <div class="th">${p.photos&&p.photos[0]?`<img src="${esc(p.photos[0])}" alt="">`:""}</div>
    <div><h3>${esc(p.title)}</h3><div class="m">${fmtPrice(p.price_cents)}${p.size?` – ${esc(p.size)}`:""}${p.section?` – ${secLabel(p.section)}`:` – <b>sans rayon</b>`}</div></div>
    <div class="act">
      <label class="sr" for="s-${p.id}">Statut</label>
      <select class="select" id="s-${p.id}">${Object.entries(STATUSES).map(([k,t])=>`<option value="${k}" ${p.status===k?"selected":""}>${t}</option>`).join("")}</select>
      <button class="btn ghost small" data-edit="${p.id}">Modifier</button>
      <button class="btn ghost small" data-dup="${p.id}">Dupliquer</button>
      <button class="btn danger small" data-del="${p.id}">Supprimer</button>
    </div></div>`).join("");
  ls.querySelectorAll("select").forEach(s=>s.onchange=async()=>{
    const id = s.id.slice(2);
    try{ await sb(`/rest/v1/products?id=eq.${id}`,{method:"PATCH",body:{status:s.value},headers:{Prefer:"return=minimal"}}); adm.items.find(p=>p.id===id).status=s.value; state.products=null; toast("Statut mis à jour"); }
    catch(e){ toast("Échec : "+e.message); }
  });
  ls.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const p = adm.items.find(x=>x.id===b.dataset.edit); resetForm(); adm.editing=p;
    adm.photos=(p.photos||[]).map(u=>({src:u})); adm.view="add"; drawAdmin(); window.scrollTo(0,0);
  });
  ls.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>{
    const p = adm.items.find(x=>x.id===b.dataset.dup); resetForm();
    adm.last = {title:p.title,section:p.section,category:p.category,condition:p.condition,brand:p.brand,size:p.size,price_cents:p.price_cents,description:p.description};
    adm.view="add"; drawAdmin(); window.scrollTo(0,0); toast("Fiche copiée : ajoute les photos");
  });
  ls.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const p = adm.items.find(x=>x.id===b.dataset.del);
    if(!confirm(`Supprimer définitivement « ${p.title} » ?`)) return;
    try{
      await sb(`/rest/v1/products?id=eq.${p.id}`,{method:"DELETE",headers:{Prefer:"return=minimal"}});
      for(const u of p.photos||[]){ const path = pathFromUrl(u); if(path) sb(`/storage/v1/object/${BUCKET}/${path}`,{method:"DELETE"}).catch(()=>{}); }
      adm.items=null; state.products=null; toast("Article supprimé"); drawList();
    }catch(e){ toast(/foreign key|violates/i.test(e.message)?"Cet article est lié à une commande : passez-le en « Masqué »." : "Échec : "+e.message); }
  });
}
